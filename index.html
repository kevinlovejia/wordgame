<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词境</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="extras.css"></head><body><main>
<section id="login" class="screen active"><div class="lobby-content"><h1>词境</h1><p>登录你的词汇成长记录</p><input id="loginName" placeholder="用户名"><input id="loginPassword" type="password" placeholder="密码（至少 6 位）"><label><input id="autoLogin" type="checkbox" checked> 自动登录此设备</label><button id="loginSubmit" class="primary">登录</button><button id="registerSubmit" class="secondary">注册新账号</button><small id="loginMessage"></small></div></section>
<section id="home" class="screen"><header class="topbar"><b>词境</b><span id="homeLevel">青铜 I · Lv.1</span></header><div class="home-content"><h1>把词汇，变成<br><em>你的主场。</em></h1><div class="mode-grid"><button class="mode-card practice-card" id="startPractice">✦<strong>开始练习</strong><small>CSV 词库 · 智能跳过熟记词</small></button><button class="mode-card duel-card" id="goLobby">⚡<strong>在线 PK</strong><small>实时 WebSocket 对战</small></button></div><button id="goMistakes" class="secondary">错题复习 <span id="mistakeCount"></span></button></div></section>
<section id="practice" class="screen"><header class="game-header"><button class="back" data-home>←</button><b>记忆练习 <span id="practiceProgress"></span></b></header><div class="question-wrap"><button id="practiceCount" class="count-setting">本轮 30 题 · 设置</button><p class="hint">选择正确的中文释义</p><div class="word-card"><h2 id="practiceWord"></h2><p id="practicePhonetic"></p></div><button id="familiarBtn" class="secondary">熟悉，跳过此词</button><div id="practiceAnswers" class="answers"></div></div></section>
<section id="mistakes" class="screen"><header class="game-header"><button class="back" data-home>←</button><b>错题复习</b></header><div class="question-wrap"><div class="word-card"><h2 id="mistakeWord"></h2></div><div id="mistakeAnswers" class="answers"></div></div></section>
<section id="lobby" class="screen"><header class="game-header"><button class="back" data-home>←</button><b>在线 PK</b></header><div class="lobby-content"><button id="createRoom" class="primary">创建房间</button><input id="roomInput" inputmode="numeric" maxlength="4" placeholder="输入 4 位房间号"><button id="joinRoom" class="secondary">加入房间</button></div></section>
<section id="waiting" class="screen"><header class="game-header"><button id="leaveRoom" class="back">←</button><b>等待对手</b></header><div class="waiting-content"><p>房间号</p><h1 id="roomNumber"></h1><button id="pkCount" class="count-setting">本局 30 题 · 设置</button><button id="copyRoom" class="secondary">复制房间号</button><small>对手加入后题数锁定</small></div></section>
<section id="duel" class="screen"><header class="duel-header"><b id="myScore">0 分</b><span id="duelClock">12</span><b id="opponentScore">0 分</b></header><div class="duel-question"><p id="duelProgress"></p><div class="word-card"><h2 id="duelWord"></h2><p id="duelPhonetic"></p></div><div id="duelAnswers" class="answers"></div><p id="duelStatus"></p></div></section>
<section id="result" class="screen"><div class="result-content"><h2 id="resultTitle"></h2><div class="final-score"><b id="finalMy"></b>:<b id="finalOpp"></b></div><button id="rematch" class="primary">再来一局</button><button data-home class="secondary">回到主页</button></div></section></main>
<div id="countModal" class="modal"><div><h3>设置题目数量</h3><input id="countRange" type="range" min="10" max="100" step="10" value="30"><b id="countValue">30 题</b><button id="saveCount" class="primary">确定</button></div></div><div id="toast"></div><script src="app.js"></script></body></html>
